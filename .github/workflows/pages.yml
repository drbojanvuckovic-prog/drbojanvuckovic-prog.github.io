name: Deploy dissertation portal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dissertation portal
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name 'bojan_vuckovic_disertacija_portal_MEDICAL_TECH*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Portal ZIP is missing from repository root."
            exit 1
          fi
          if ! unzip -tq "$ZIP" >/dev/null 2>&1; then
            echo "Uploaded file is not a valid ZIP archive."
            exit 1
          fi
          rm -rf _site _unpack
          mkdir -p _site _unpack
          unzip -q "$ZIP" -d _unpack
          INDEX="$(find _unpack -maxdepth 3 -type f -name index.html -print -quit)"
          if [ -z "$INDEX" ]; then
            echo "index.html not found in ZIP."
            exit 1
          fi
          SITE_DIR="$(dirname "$INDEX")"
          cp -a "$SITE_DIR"/. _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
