name: Deploy dissertation portal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dissertation portal
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name 'bojan_vuckovic_disertacija_portal_MEDICAL_TECH*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Portal ZIP is missing from repository root."
            exit 1
          fi
          if ! unzip -tq "$ZIP" >/dev/null 2>&1; then
            echo "Uploaded file is not a valid ZIP archive."
            exit 1
          fi
          rm -rf _site _unpack
          mkdir -p _site _unpack
          unzip -q "$ZIP" -d _unpack
          INDEX="$(find _unpack -maxdepth 3 -type f -name index.html -print -quit)"
          if [ -z "$INDEX" ]; then
            echo "index.html not found in ZIP."
            exit 1
          fi
          SITE_DIR="$(dirname "$INDEX")"
          cp -a "$SITE_DIR"/. _site/

          # Mobile-only layer: keeps desktop portal unchanged.
          mkdir -p _site/assets
          cp mobile-overrides.css _site/assets/mobile-overrides.css
          cp mobile-nav.js _site/assets/mobile-nav.js

          python3 - <<'PY'
          from pathlib import Path
          root = Path("_site")
          for p in root.glob("*.html"):
              s = p.read_text(encoding="utf-8")
              css = '<link rel="stylesheet" href="assets/mobile-overrides.css">'
              js = '<script src="assets/mobile-nav.js"></script>'
              if "assets/mobile-overrides.css" not in s:
                  s = s.replace("</head>", css + "</head>", 1)
              if "assets/mobile-nav.js" not in s:
                  s = s.replace("</body>", js + "</body>", 1)
              p.write_text(s, encoding="utf-8")
          PY

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
